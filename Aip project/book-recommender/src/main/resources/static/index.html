<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bookwise – Book Recommendation System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#16222d;--muted:#5d6b78;--bg:#eceff2;--card:#fff;--line:#d9dee3;--teal:#0e6b66;--teal-d:#0a4f4b;--gold:#d49a2a;--shelf:#8a6a46;
 --serif:'DM Serif Display',Georgia,serif;--sans:'Source Sans 3',system-ui,Segoe UI,sans-serif}
*{box-sizing:border-box}
body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.5}
button,input,select{font:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
header{background:var(--teal-d);color:#fff;padding:18px 24px 22px}
.bar{max-width:1150px;margin:0 auto;display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;justify-content:space-between}
.brand h1{font-family:var(--serif);font-weight:400;font-size:2rem;margin:0;line-height:1.1}
.brand p{margin:2px 0 0;color:#b9d6d3;font-size:.95rem}
.who{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.who label{color:#b9d6d3;font-size:.9rem}
select,input[type=text],input[type=number],input[type=search]{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;color:var(--ink)}
.btn{border:0;border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;background:var(--gold);color:#2b1d00}
.btn.ghost{background:transparent;color:#fff;border:1px solid #5f9a96}
.btn.dark{background:var(--teal);color:#fff}
main{max-width:1150px;margin:0 auto;padding:26px 24px 40px}
h2{font-family:var(--serif);font-weight:400;font-size:1.7rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 16px}
.shelf{display:flex;gap:22px;overflow-x:auto;padding:6px 6px 20px;border-bottom:12px solid var(--shelf);border-radius:0 0 4px 4px;background:linear-gradient(#e3e7ea,#eceff2)}
.item{flex:0 0 150px;cursor:pointer;background:none;border:0;padding:0;text-align:left;color:inherit}
.item:hover .cover{transform:translateY(-6px)}
.cover{position:relative;aspect-ratio:2/3;width:100%;border-radius:3px 8px 8px 3px;background-size:cover;background-position:center;
 box-shadow:inset 7px 0 8px -4px rgba(0,0,0,.35),0 8px 16px rgba(20,30,40,.3);transition:transform .2s;overflow:hidden}
.gen{position:absolute;inset:0;padding:14px 12px 12px 18px;display:flex;flex-direction:column;justify-content:space-between;color:#fff}
.gen b{font-family:var(--serif);font-weight:400;font-size:1.15rem;line-height:1.15;text-wrap:balance}
.gen i{font-style:normal;font-size:.8rem;opacity:.85}
.cover.real .gen{display:none}
.item .t{margin-top:10px;font-weight:700;font-size:.95rem;line-height:1.25}
.item .a{color:var(--muted);font-size:.85rem}
.item .m{font-size:.82rem;color:var(--teal);font-weight:600}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:34px 0 14px}
.tools h2{margin-right:auto}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 14px;cursor:pointer;font-weight:600;color:var(--muted)}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:26px 22px}
.empty{color:var(--muted);padding:18px 4px}
dialog{border:0;border-radius:14px;padding:0;max-width:640px;width:calc(100% - 32px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,25,30,.55)}
.dlg{display:flex;gap:22px;padding:24px;flex-wrap:wrap}
.dlg .cover{width:170px;flex:none}
.dlg .info{flex:1;min-width:220px}
.dlg h3{font-family:var(--serif);font-weight:400;font-size:1.7rem;line-height:1.15;margin:0}
.dlg .by{color:var(--muted);margin:2px 0 10px}
.tag{display:inline-block;background:#e0eeed;color:var(--teal-d);border-radius:6px;padding:2px 10px;font-weight:600;font-size:.85rem;margin-right:6px}
.stars{display:flex;gap:2px;margin:6px 0}
.stars button{background:none;border:0;font-size:2rem;line-height:1;cursor:pointer;color:#c3cbd2;padding:0 2px}
.stars button.on{color:var(--gold)}
.form{padding:24px;display:grid;gap:10px}
.form h3{font-family:var(--serif);font-weight:400;font-size:1.5rem;margin:0}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
.x{margin-left:auto;background:none;border:0;font-size:1.5rem;cursor:pointer;color:var(--muted);align-self:flex-start}
footer{max-width:1150px;margin:0 auto;padding:0 24px 34px;color:var(--muted);font-size:.88rem}
.flow{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-weight:600;color:var(--ink);margin-bottom:6px}
.flow span.n{background:#fff;border:1px solid var(--line);border-radius:8px;padding:3px 10px}
.pill{display:inline-flex;gap:8px;align-items:center;background:#0a4f4b;border:1px solid #3e8782;border-radius:999px;padding:4px 12px;font-size:.88rem;color:#d7efec}
.dot{width:9px;height:9px;border-radius:50%;background:#e0524d}.dot.ok{background:#4ade80}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;transition:transform .25s;z-index:9}
#toast.show{transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="bar">
  <div class="brand"><h1>Bookwise</h1><p>Find your next read, based on what you already love</p></div>
  <div class="who">
    <span class="pill" id="pill"><span class="dot" id="dot"></span><span id="pilltxt">Checking database…</span></span>
    <label for="userSel">Reader</label><select id="userSel"></select>
    <button class="btn ghost" id="newUserBtn">New reader</button>
  </div>
</div></header>

<main>
  <h2 id="recTitle">Recommended for you</h2>
  <p class="sub" id="recSub">Pick a reader above to see personalised picks.</p>
  <div class="shelf" id="recs"></div>

  <div class="tools">
    <h2>All books</h2>
    <input type="search" id="q" placeholder="Search title, author or genre" aria-label="Search books">
    <button class="btn dark" id="addBookBtn">Add a book</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"></div>
</main>

<footer>
  <div class="flow"><span class="n">Browser</span>→<span class="n">Spring Boot REST API</span>→<span class="n">Hibernate + JDBC</span>→<span class="n">MySQL database</span></div>
  <div id="dbinfo">Connecting…</div>
</footer>

<dialog id="bookDlg"><div class="dlg">
  <div class="cover" id="dCover"></div>
  <div class="info">
    <div style="display:flex"><h3 id="dTitle"></h3><button class="x" aria-label="Close" onclick="bookDlg.close()">×</button></div>
    <p class="by" id="dBy"></p>
    <p><span class="tag" id="dGenre"></span><span class="tag" id="dYear"></span></p>
    <p id="dDesc"></p>
    <b>Your rating</b>
    <div class="stars" id="stars"></div>
  </div>
</div></dialog>

<dialog id="userDlg"><div class="form">
  <h3>New reader</h3>
  <input type="text" id="uName" placeholder="Username" aria-label="Username">
  <div class="row"><button class="btn ghost" style="color:var(--ink);border-color:var(--line)" onclick="userDlg.close()">Cancel</button><button class="btn dark" id="saveUser">Add reader</button></div>
</div></dialog>

<dialog id="addDlg"><div class="form">
  <h3>Add a book</h3>
  <input type="text" id="fTitle" placeholder="Title" aria-label="Title">
  <input type="text" id="fAuthor" placeholder="Author" aria-label="Author">
  <input type="text" id="fGenre" placeholder="Genre (e.g. Sci-Fi)" aria-label="Genre">
  <input type="number" id="fYear" placeholder="Year published" aria-label="Year">
  <input type="text" id="fDesc" placeholder="Short description" aria-label="Description">
  <div class="row"><button class="btn ghost" style="color:var(--ink);border-color:var(--line)" onclick="addDlg.close()">Cancel</button><button class="btn dark" id="saveBook">Save book</button></div>
</div></dialog>

<div id="toast" role="status"></div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=(p,o)=>fetch('/api'+p,o).then(r=>r.json());
const post=(p,b)=>api(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
let books=[], byId={}, genre='All', current=null, timer;

/* ---------- covers ---------- */
const PAL={'Sci-Fi':['#16324f','#3f7cb5'],'Romance':['#7a2848','#d2688a'],'Fantasy':['#3b2a63','#8a67c4'],
 'Thriller':['#2a2f36','#8a3b3b'],'Non-Fiction':['#235a43','#6fae88']};
function grad(g){let p=PAL[g];if(!p){let h=0;for(const c of String(g))h=(h*31+c.charCodeAt(0))%360;p=['hsl('+h+',45%,24%)','hsl('+h+',45%,48%)']}return `linear-gradient(155deg,${p[0]},${p[1]})`}
const store=JSON.parse(localStorage.getItem('covers')||'{}');
async function coverUrl(b){
  const k=b.title+'|'+b.author;
  if(k in store) return store[k];
  try{
    const r=await fetch('https://openlibrary.org/search.json?limit=1&fields=cover_i&title='+encodeURIComponent(b.title)+'&author='+encodeURIComponent(b.author));
    const d=await r.json(), id=d.docs&&d.docs[0]&&d.docs[0].cover_i;
    store[k]=id?'https://covers.openlibrary.org/b/id/'+id+'-M.jpg':null;
    localStorage.setItem('covers',JSON.stringify(store));
    return store[k];
  }catch(e){return null}
}
function cover(b){
  const el=document.createElement('div');
  el.className='cover';
  el.style.backgroundImage=grad(b.genre);
  el.innerHTML=`<div class="gen"><b>${esc(b.title)}</b><i>${esc(b.author)}</i></div>`;
  coverUrl(b).then(u=>{ if(!u)return; const im=new Image();
    im.onload=()=>{ if(im.naturalWidth>20){ el.style.backgroundImage=`url(${u})`; el.classList.add('real'); } };
    im.src=u; });
  return el;
}
function item(b,meta){
  const w=document.createElement('button'); w.className='item';
  w.appendChild(cover(b));
  w.insertAdjacentHTML('beforeend',`<div class="t">${esc(b.title)}</div><div class="a">${esc(b.author)}</div>${meta?`<div class="m">${meta}</div>`:''}`);
  w.onclick=()=>openBook(b.id);
  return w;
}

/* ---------- data ---------- */
async function checkDb(){
  try{
    const d=await api('/db-status');
    $('dot').className='dot'+(d.connected?' ok':'');
    $('pilltxt').textContent=d.connected?'Connected to '+d.database.split(' ')[0]:'Database unreachable';
    $('dbinfo').textContent=`Database: ${d.database} · Driver: ${d.driver} · ${d.url}`;
  }catch(e){ $('pilltxt').textContent='Server unreachable'; $('dbinfo').textContent='Could not reach the server.'; }
}
async function loadUsers(sel){
  const u=await api('/users');
  $('userSel').innerHTML=u.map(x=>`<option value="${x.id}">${esc(x.username)}</option>`).join('');
  if(sel) $('userSel').value=sel;
  loadRecs();
}
async function loadBooks(){
  const q=$('q').value.trim();
  books=await api('/books'+(q?'?q='+encodeURIComponent(q):''));
  books.forEach(b=>byId[b.id]=b);
  renderChips(); renderGrid();
}
function renderChips(){
  const gs=['All',...new Set(books.map(b=>b.genre))];
  if(!gs.includes(genre)) genre='All';
  $('chips').innerHTML=gs.map(g=>`<button class="chip${g===genre?' on':''}" data-g="${esc(g)}">${esc(g)}</button>`).join('');
  $('chips').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{genre=c.dataset.g;renderChips();renderGrid()});
}
function renderGrid(){
  const g=$('grid'); g.innerHTML='';
  const list=books.filter(b=>genre==='All'||b.genre===genre);
  if(!list.length){g.innerHTML='<div class="empty">No books match your search. Try another word or add the book.</div>';return}
  list.forEach(b=>g.appendChild(item(b,esc(b.genre))));
}
async function loadRecs(){
  const id=$('userSel').value; if(!id) return;
  const name=$('userSel').selectedOptions[0].textContent;
  const r=await api('/recommendations/'+id);
  $('recTitle').textContent='Picked for '+name;
  $('recSub').textContent=r.length?'Books you haven’t rated yet, from genres you rated 4 or 5 stars.':'You’ve rated every book. Add more books to get new picks.';
  const s=$('recs'); s.innerHTML='';
  r.forEach(x=>{
    const b=byId[x.id]||x;
    s.appendChild(item(b, x.votes?`★ ${x.avgScore} (${x.votes})`:'Not rated yet'));
  });
}

/* ---------- book dialog ---------- */
function openBook(id){
  const b=byId[id]; if(!b) return; current=b;
  const c=cover(b); c.id='dCover'; $('dCover').replaceWith(c);
  $('dTitle').textContent=b.title; $('dBy').textContent='by '+b.author;
  $('dGenre').textContent=b.genre; $('dYear').textContent=b.publishedYear||'Year n/a'; $('dYear').style.display=b.publishedYear?'':'none';
  $('dDesc').textContent=b.description||'No description yet.';
  drawStars(0); bookDlg.showModal();
}
function drawStars(n){
  $('stars').innerHTML=[1,2,3,4,5].map(i=>`<button class="${i<=n?'on':''}" aria-label="${i} star${i>1?'s':''}" data-s="${i}">★</button>`).join('');
  $('stars').querySelectorAll('button').forEach(b=>b.onclick=()=>rate(+b.dataset.s));
}
async function rate(score){
  const r=await post('/ratings',{userId:+$('userSel').value,bookId:current.id,score});
  if(r.error){toast(r.error);return}
  drawStars(score); toast('Saved your '+score+'-star rating for '+current.title);
  loadRecs();
}

/* ---------- forms ---------- */
$('newUserBtn').onclick=()=>{$('uName').value='';userDlg.showModal();$('uName').focus()};
$('saveUser').onclick=async()=>{
  const n=$('uName').value.trim(); if(!n) return;
  const u=await post('/users',{username:n}); userDlg.close(); await loadUsers(u.id); toast('Reader '+n+' is ready');
};
$('addBookBtn').onclick=()=>{['fTitle','fAuthor','fGenre','fYear','fDesc'].forEach(i=>$(i).value='');addDlg.showModal()};
$('saveBook').onclick=async()=>{
  const t=$('fTitle').value.trim(),a=$('fAuthor').value.trim(),g=$('fGenre').value.trim();
  if(!t||!a||!g){toast('Title, author and genre are required');return}
  await post('/books',{title:t,author:a,genre:g,publishedYear:+$('fYear').value||null,description:$('fDesc').value.trim()});
  addDlg.close(); await loadBooks(); toast('Added '+t);
};
$('q').oninput=()=>{clearTimeout(timer);timer=setTimeout(loadBooks,250)};
$('userSel').onchange=loadRecs;
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2600)}

(async()=>{ checkDb(); await loadBooks(); await loadUsers(); })();
</script>
</body>
</html>
